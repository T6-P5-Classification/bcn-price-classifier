# App + base de datos (#26).
#
# Antes de arrancar, genera el modelo (no está en Git):
#   python -m src.train_app_model
#   docker compose up --build        # app en http://localhost:8501
#   docker compose down              # para; los datos se conservan en los volúmenes
#
# La app guarda hoy predicciones y feedback en CSV (src/feedback_store.py), en
# el volumen "feedback-data", así que no se pierden al parar o recrear el
# contenedor. MongoDB queda arrancado y accesible para la app en MONGODB_URI;
# guardar ahí predicciones y feedback es #27.

services:
  app:
    build: .
    image: bcn-price-classifier
    ports:
      - "8501:8501"
    environment:
      FEEDBACK_DIR: /app/data/feedback
      MONGODB_URI: mongodb://mongo:27017/bcn_price_classifier
    volumes:
      - feedback-data:/app/data/feedback
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0.14
    # Sin puerto publicado: solo la app (red interna de Compose) puede conectarse.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  feedback-data:
  mongo-data:
