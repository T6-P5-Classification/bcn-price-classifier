name: Personal GitHub lifecycle

on:
  pull_request_target:
    branches: ["dev"]
    types: [opened, reopened, ready_for_review, converted_to_draft, edited, synchronize, closed, review_requested, review_request_removed]
  workflow_run:
    workflows: [Personal GitHub review signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR to synchronize using its current state
        required: false
        type: string
      issue_number:
        description: Start work on an issue (use instead of PR number)
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: personal-github-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pull_request_number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Privileged workflow: never check out or execute PR-head code.
      - name: Check out trusted default branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Synchronize issue lifecycle
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        with:
          script: |
            if (!process.env.PROJECT_TOKEN) {
              throw new Error('Missing Actions secret PROJECT_AUTOMATION_TOKEN; configure repository read and Project write access.');
            }
            const projectGithub = new github.constructor({ auth: process.env.PROJECT_TOKEN });
            const config = require('./.github/personal-github.json');
            const { synchronize, startIssue } = require('./.github/scripts/personal-github.cjs');
            const args = { github, projectGithub, context, core, config };
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.event !== 'pull_request_review' || run.repository.full_name !== config.repository) {
                throw new Error('Unexpected review signal source.');
              }
              const numbers = [...new Set(run.pull_requests.map(pr => pr.number))];
              if (!numbers.length) throw new Error('Review signal has no PR metadata; synchronize the PR manually.');
              for (const prNumber of numbers) await synchronize({ ...args, prNumber });
            } else if (context.eventName === 'workflow_dispatch' && process.env.ISSUE_NUMBER) {
              if (process.env.PR_NUMBER) throw new Error('Provide either issue_number or pull_request_number, not both.');
              await startIssue({ ...args, issueNumber: process.env.ISSUE_NUMBER });
            } else {
              await synchronize({ ...args, prNumber: process.env.PR_NUMBER });
            }
